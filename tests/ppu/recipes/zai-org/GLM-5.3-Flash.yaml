schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: glm-5.3-flash-mxfp4
    tokenizer: glm-5.3-flash-mxfp4
  hf_model_id: T-HEAD/GLM-5.3-Flash-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: glm_5_3_flash_mxfp4
  served_name: glm-5.3-flash-mxfp4
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 2
  default_features:
    - tool_calling
    - reasoning
  external_env: []
model:
  model_id: zai-org/GLM-5.3-Flash
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "2"
    - --block-size
    - "256"
    - --max-model-len
    - "16384"
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env: {}
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
  reasoning:
    args:
      - --reasoning-parser
      - glm45
variants:
  default:
    precision: mxfp4
    extra_args: []
    extra_env: {}
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
