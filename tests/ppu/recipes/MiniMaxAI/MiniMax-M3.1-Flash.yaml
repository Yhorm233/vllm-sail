schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: minimax-m3.1-flash-fp8
    tokenizer: minimax-m3.1-flash-fp8
  hf_model_id: T-HEAD/MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: minimax-m3.1-flash-fp8
  served_name: MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 8
  default_features:
    - tool_calling
    - reasoning
  external_env: []
model:
  model_id: MiniMaxAI/MiniMax-M3.1-Flash
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "8"
    - --block-size
    - "128"
    - --kv-cache-dtype
    - fp8
    - --gpu-memory-utilization
    - "0.9"
    - --max-model-len
    - "16384"
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env: {}
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - minimax_m3
  reasoning:
    args:
      - --reasoning-parser
      - minimax_m3
variants:
  default:
    precision: fp8
    extra_args: []
    extra_env: {}
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill_long:
    hardware: zhenwu_m890
    args: []
  eval_longctx:
    hardware: zhenwu_m890
    args: []
notes: >-
  Default serving configuration aligns with the single-node 8-card Zhenwu M890
  FP8 baseline (TP8, FP8 KV cache, block size 128, 16K context window, and
  MiniMax M3 tool-call/reasoning parsers). Prefix caching is controlled by the
  test policy.
