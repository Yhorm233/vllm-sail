schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: deepseek-v4.1-flash-mxfp4
    tokenizer: deepseek-v4.1-flash-mxfp4
  hf_model_id: T-HEAD/DeepSeek-V4.1-Flash-1017-MXFP4-FP8-Engram-MXFP8
  golden_model_key: deepseek_v4_1_flash_mxfp4
  served_name: deepseek-v4.1-flash-mxfp4
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 8
  default_features:
    - tool_calling
    - reasoning
  external_env: []
model:
  model_id: deepseek-ai/DeepSeek-V4.1-Flash
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "8"
    - --block-size
    - "128"
    - --gpu-memory-utilization
    - "0.9"
    - --mm-encoder-tp-mode
    - data
    - --engram-config
    - '{"cpu_offload":true}'
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v41
  reasoning:
    args:
      - --tokenizer-mode
      - deepseek_v41
      - --reasoning-parser
      - deepseek_v41
variants:
  default:
    precision: mxfp4
    extra_args: []
    extra_env: {}
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill_long:
    hardware: zhenwu_m890
    args: []
  eval_longctx:
    hardware: zhenwu_m890
    args: []
notes: >-
  Default serving configuration aligns with the P0 single-node 8-card Zhenwu M890
  performance baseline (TP8, block size 128, Engram CPU offload, and DeepSeek
  V4.1 tokenizer/reasoning/tool-call parsers). Prefix caching is controlled by
  the test policy.
