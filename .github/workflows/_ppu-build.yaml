name: PPU wheel build

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: Exact SAIL commit to build (blank uses github.sha)
        type: string
        default: ""
      build_image:
        description: Digest-pinned SDK image (blank uses the default stack image)
        type: string
        default: ""
      vllm_ref:
        description: vLLM ref (blank uses .github/vllm-main-verified.commit)
        type: string
        default: ""
      pytorch_sail_arch:
        description: Semicolon-separated HG architectures (blank uses ppu_15;ppu_10)
        type: string
        default: ""
      resolve_native_donors:
        description: Look for verified native donors before building a PR
        type: boolean
        default: false
    outputs:
      image:
        description: Build image recorded for downstream tests
        value: ${{ jobs.build.outputs.image }}
      ready_epoch:
        description: Unix epoch recorded when wheel artifacts are ready
        value: ${{ jobs.build.outputs.ready_epoch }}

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  build:
    name: PPU wheel build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      image: ${{ steps.image.outputs.image }}
      ready_epoch: ${{ steps.ready.outputs.ready_epoch }}
    container:
      image: ${{ inputs.build_image || 'download.t-head.cn/docker_release/pytorch@sha256:a33a67832f7ec442c481421e94255518dd67e464406f8e610c15d2b594b21f80' }}
    env:
      VLLM_SAIL_BUILD_IMAGE: ${{ inputs.build_image || 'download.t-head.cn/docker_release/pytorch@sha256:a33a67832f7ec442c481421e94255518dd67e464406f8e610c15d2b594b21f80' }}
      VLLM_REF: ${{ inputs.vllm_ref }}
      PYTORCH_SAIL_ARCH: ${{ inputs.pytorch_sail_arch || 'ppu_15;ppu_10' }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # The job container image ships a global/system git
          # url.<internal-mirror>.insteadOf = https://github.com rewrite. Left in
          # place it makes actions/checkout fetch from the internal mirror and
          # fail, so strip only the github.com rewrites before checkout.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done
          echo "=== insteadOf after (system) ==="
          git config --system --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none
          echo "=== insteadOf after (global) ==="
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none

      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }
      - name: Check out donor selection code
        if: inputs.resolve_native_donors
        id: donor-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve native wheel candidates
        if: steps.donor-checkout.outcome == 'success'
        id: donors
        timeout-minutes: 3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.pr_head_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$WORKFLOW_SHA"
          python3 -m scripts.ci.ppu_wheel_donors

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ inputs.pr_head_sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
        run: test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Record build image for downstream tests
        id: image
        run: printf 'image=%s\n' "$VLLM_SAIL_BUILD_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download native wheel donor 1
        id: donor-1
        if: steps.donors.outputs.run_1 != '' && steps.donors.outputs.artifact_1 != ''
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.donors.outputs.artifact_1 }}
          path: ${{ runner.temp }}/ppu-native-donors/1
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.donors.outputs.run_1 }}

      - name: Download native wheel donor 2
        id: donor-2
        if: steps.donors.outputs.run_2 != '' && steps.donors.outputs.artifact_2 != ''
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.donors.outputs.artifact_2 }}
          path: ${{ runner.temp }}/ppu-native-donors/2
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.donors.outputs.run_2 }}

      - name: Download native wheel donor 3
        id: donor-3
        if: steps.donors.outputs.run_3 != '' && steps.donors.outputs.artifact_3 != ''
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.donors.outputs.artifact_3 }}
          path: ${{ runner.temp }}/ppu-native-donors/3
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.donors.outputs.run_3 }}

      - name: Build or repackage wheels
        shell: bash
        env:
          VLLM_SAIL_NATIVE_REUSE_ROOT: ${{ runner.temp }}/ppu-native-donors
          SOURCE_1: ${{ steps.donor-1.outcome == 'success' && steps.donors.outputs.source_1 || '' }}
          SOURCE_2: ${{ steps.donor-2.outcome == 'success' && steps.donors.outputs.source_2 || '' }}
          SOURCE_3: ${{ steps.donor-3.outcome == 'success' && steps.donors.outputs.source_3 || '' }}
        run: |
          set -euo pipefail
          slot=0
          for source in "$SOURCE_1" "$SOURCE_2" "$SOURCE_3"; do
            slot=$((slot + 1))
            if [[ "$source" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\n' "$source" > "$VLLM_SAIL_NATIVE_REUSE_ROOT/$slot.source"
            fi
          done
          # Older checkouts still understand the single-donor input.
          if [[ -f "$VLLM_SAIL_NATIVE_REUSE_ROOT/1.source" ]]; then
            export VLLM_SAIL_NATIVE_REUSE_DIR="$VLLM_SAIL_NATIVE_REUSE_ROOT/1"
          fi
          bash scripts/ci/build_ppu_wheels.sh

      - name: Upload wheels
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: artifacts/wheels/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Record wheel readiness epoch
        id: ready
        if: success()
        run: printf 'ready_epoch=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          overwrite: true
          path: |
            artifacts/logs/**
            artifacts/build-manifest.txt
          if-no-files-found: warn
          retention-days: 14
