name: PPU accuracy tests

# Called by ppu-debug.yaml, ppu-accuracy-nightly.yaml and ppu-pr-nightly.yaml.
# Accuracy is intentionally outside the per-PR gate.

on:
  workflow_call:
    inputs:
      pr_mode:
        type: boolean
        default: false
      pr_head_sha:
        type: string
        default: ""
      wheel_source_sha:
        description: Validated SAIL source of the reused wheels
        type: string
        default: ""
      build_run_id:
        description: Run supplying the ppu-wheels artifact (blank when skip_wheel_build is true)
        required: false
        default: ""
        type: string
      models:
        description: Comma-separated accuracy model catalog keys
        type: string
        default: deepseek-v4-mxfp4
      image_tag:
        description: Allowed runtime image tag (tag only, no registry or repository prefix)
        type: string
        default: ""
      image_digest:
        description: Optional immutable runtime image digest (sha256:<64-hex>)
        type: string
        default: ""
      skip_wheel_build:
        description: Skip wheel download/install and run directly inside the prebuilt runtime image
        type: boolean
        default: false
      hf_home:
        description: Host Hugging Face cache root
        type: string
        # Runners mount the shared NFS export at /nas_aisw/datasets and keep
        # the offline cache root there. Declaring it here stops the container
        # wrapper from falling back to whatever HF_HOME the host happens to
        # export, which is invisible from the repository.
        default: /nas_aisw/datasets/hf_cache
      gsm8k_dataset_path:
        description: Host GSM8K dataset directory
        type: string
        # /ppusw is the developer box mount; the CI runners mount the same NFS
        # export at /nas_aisw/datasets, so the trees repeat one level deeper.
        default: /nas_aisw/datasets/datasets/vision/EvalScope/data/gsm8k/v2/gsm8k
      dg_cache_dir:
        description: Host root for the DeepGEMM JIT kernel cache
        type: string
        # DeepGEMM JIT-compiles its kernels on first use; keeping the cache on
        # the host lets a later case -- or a later run -- skip that pass, which
        # costs a couple of minutes per model. The wrapper appends the runtime
        # image ID, so this root is shared while the binaries stay per-image.
        default: /nas_aisw/vllmci_dgcache

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  # Keyed by (build, requested models): one nightly dispatches several models
  # of the same build, and those lanes must not cancel each other. Lanes that
  # ask for the same set still queue, which keeps a runner's exclusive lock
  # from being taken by a duplicate dispatch.
  group: accuracy-ppu-${{ github.ref }}-${{ inputs.pr_mode && github.run_id || inputs.build_run_id || github.run_id }}-${{ inputs.models }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve accuracy matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.accuracy_matrix }}
    steps:
      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }

      - name: Validate runtime image and build inputs
        env:
          PR_MODE: ${{ inputs.pr_mode }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SKIP_WHEEL_BUILD: ${{ inputs.skip_wheel_build }}
        run: |
          if [[ "$PR_MODE" == true ]]; then
            if [[ "$SKIP_WHEEL_BUILD" == true || -n "$IMAGE_TAG" || -n "$IMAGE_DIGEST" ]]; then
              echo 'PR Nightly cannot override the runtime image or skip wheel installation.' >&2
              exit 1
            fi
          fi
          if [[ -n "$IMAGE_TAG" ]]; then
            if [[ "$IMAGE_TAG" == *".."* || ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo 'Invalid image_tag input: tag only, no registry or repository prefix.' >&2
              exit 1
            fi
          fi
          if [[ -n "$IMAGE_DIGEST" && ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Invalid image_digest input: expected sha256:<64-hex>.' >&2
            exit 1
          fi
          if [[ "$SKIP_WHEEL_BUILD" == true ]]; then
            if [[ -n "$BUILD_RUN_ID" || ( -z "$IMAGE_TAG" && -z "$IMAGE_DIGEST" ) ]]; then
              echo 'skip_wheel_build=true requires empty build_run_id and image_tag or image_digest.' >&2
              exit 1
            fi
          elif [[ -z "$BUILD_RUN_ID" ]]; then
            echo 'build_run_id is required when skip_wheel_build is false.' >&2
            exit 1
          fi

      - name: Validate PR Nightly inputs
        if: inputs.pr_mode
        env:
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          CASE_ID: ${{ inputs.models }}
        run: |
          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ || "$WHEEL_SOURCE_SHA" != "$PR_HEAD_SHA" ]]; then
            echo 'PR Nightly requires matching immutable source SHAs.' >&2
            exit 1
          fi
          if [[ "$BUILD_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            echo 'PR Nightly requires wheels from this run.' >&2
            exit 1
          fi
          IFS=',' read -r -a cases <<< "$CASE_ID"
          if [[ -z "$CASE_ID" || "$CASE_ID" == *, || ${#cases[@]} -eq 0 ]]; then
            echo 'PR Nightly requires one or more distinct legacy accuracy case IDs.' >&2
            exit 1
          fi
          seen=","
          for case in "${cases[@]}"; do
            if [[ ! "$case" =~ ^[a-z0-9][a-z0-9.-]{0,63}$ || "$case" == all || "$seen" == *",$case,"* ]]; then
              echo 'PR Nightly requires one or more distinct legacy accuracy case IDs.' >&2
              exit 1
            fi
            seen+="$case,"
          done

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
        run: test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Select accuracy models
        id: select
        env:
          MODELS: ${{ inputs.models }}
          PR_MODE: ${{ inputs.pr_mode }}
        run: |
          if [[ "$PR_MODE" != true ]]; then
            python3 scripts/ci/ppu_e2e_select.py "$MODELS" >> "$GITHUB_OUTPUT"
            exit
          fi
          python3 -I - <<'PY'
          import json
          import os
          import subprocess

          cases = os.environ["MODELS"].split(",")
          try:
              if not cases or any(not case for case in cases) or len(cases) != len(set(cases)):
                  raise ValueError
              catalog = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:scripts/ci/ppu_e2e_models.json"],
                  stderr=subprocess.DEVNULL,
              ))
              include = []
              for case_id in cases:
                  matches = [entry for entry in catalog if entry["key"] == case_id]
                  if len(matches) != 1 or matches[0].get("category") != "accuracy":
                      raise ValueError
                  include.append({"case_id": case_id})
          except (ValueError, TypeError, KeyError, subprocess.CalledProcessError):
              raise SystemExit("Expected exact legacy accuracy catalog cases.") from None
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("accuracy_matrix=" + json.dumps({"include": include}, separators=(",", ":")),
                    file=output)
          PY

  accuracy:
    name: Accuracy ${{ matrix.model.case_id }}
    needs: prepare
    runs-on: 8-ppu-m890p
    # A DP+EP case may legitimately spend 100 minutes in engine startup
    # (VLLM_ENGINE_READY_TIMEOUT_S=6000) before the ~45 minute GSM8K pass, so
    # the budget has to clear both plus container setup.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Every accuracy model takes all eight devices and holds an exclusive
      # flock on the runner, so multiple cases must execute serially.
      max-parallel: 1
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    env:
      GIT_CONFIG_NOSYSTEM: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare private runtime directories and Git configuration
        id: runtime
        env:
          PR_MODE: ${{ inputs.pr_mode }}
        run: |
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          wheels="$(mktemp -d "${RUNNER_TEMP}/ppu-accuracy-wheels.XXXXXX")"
          artifacts="$(mktemp -d "${RUNNER_TEMP}/ppu-accuracy-artifacts.XXXXXX")"
          source_rel=".ppu-accuracy-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="${GITHUB_WORKSPACE}/${source_rel}"
          trusted_rel=".ppu-accuracy-trusted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trusted="${GITHUB_WORKSPACE}/${trusted_rel}"
          if [[ "$PR_MODE" == true ]]; then
            printf '::add-mask::%s\n' "$config" "$wheels" "$artifacts" "$source" "$trusted"
          fi
          {
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$config"
            printf 'wheels=%s\n' "$wheels"
            printf 'artifacts=%s\n' "$artifacts"
            printf 'source_rel=%s\n' "$source_rel"
            printf 'source=%s\n' "$source"
            printf 'trusted_rel=%s\n' "$trusted_rel"
            printf 'trusted=%s\n' "$trusted"
          } >> "$GITHUB_OUTPUT"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"

      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ inputs.pr_head_sha || github.sha }}
          path: ${{ steps.runtime.outputs.source_rel }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
          SOURCE_DIR: ${{ steps.runtime.outputs.source }}
        run: test "$(git -c safe.directory="$SOURCE_DIR" -C "$SOURCE_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out trusted CI scripts
        if: '!inputs.pr_mode'
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          path: ${{ steps.runtime.outputs.trusted_rel }}
          persist-credentials: false

      - name: Verify trusted CI revision
        if: '!inputs.pr_mode'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TRUSTED_DIR: ${{ steps.runtime.outputs.trusted }}
        run: test "$(git -c safe.directory="$TRUSTED_DIR" -C "$TRUSTED_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download CI-built wheels
        id: wheels
        if: '!inputs.skip_wheel_build'
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: ${{ steps.runtime.outputs.wheels }}
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ !inputs.pr_mode && github.token || '' }}

      - name: Run GSM8K accuracy in the preloaded CUDA-compatible runtime
        if: '!inputs.pr_mode'
        env:
          TRUSTED_CI_DIR: ${{ steps.runtime.outputs.trusted }}
          PPU_CI_SOURCE_DIR: ${{ steps.runtime.outputs.source }}
          PPU_CI_SOURCE_SHA: ${{ inputs.pr_head_sha || github.sha }}
          PPU_CI_WHEELS_DIR: ${{ !inputs.skip_wheel_build && steps.runtime.outputs.wheels || '' }}
          PPU_CI_ARTIFACT_DIR: ${{ steps.runtime.outputs.artifacts }}
          PPU_CI_DEVICE_COUNT: ${{ matrix.model.ppu_count }}
          PPU_CI_REQUIRE_PR_ARTIFACT: ${{ inputs.pr_mode }}
          PPU_CI_WHEEL_SOURCE_SHA: ${{ !inputs.skip_wheel_build && (inputs.wheel_source_sha || inputs.pr_head_sha || github.sha) || '' }}
          PPU_CI_SKIP_WHEEL_INSTALL: ${{ inputs.skip_wheel_build == true }}
          PPU_CI_RUNTIME_IMAGE_TAG: ${{ inputs.image_tag }}
          PPU_CI_RUNTIME_IMAGE_DIGEST: ${{ inputs.image_digest }}
          PPU_CI_HF_HOME: ${{ inputs.hf_home }}
          PPU_CI_DG_CACHE_DIR: ${{ inputs.dg_cache_dir }}
          HF_HUB_OFFLINE: "1"
          GSM8K_DATASET_PATH: ${{ inputs.gsm8k_dataset_path }}
          MODEL_KEY: ${{ matrix.model.model_key }}
          CASE_ID: ${{ matrix.model.case_id }}
          # Full 'vllm serve' argv for this case, or [] to use the evaluator's
          # built-in list. Cases sharing a checkpoint differ only here.
          SERVER_CMD: ${{ toJSON(matrix.model.server_cmd) }}
          # Extra env for the server process only, or {} when unused.
          SERVER_ENV: ${{ toJSON(matrix.model.server_env) }}
          MODEL_ID: ${{ matrix.model.model_id }}
        run: bash "${TRUSTED_CI_DIR}/scripts/ci/ppu_runtime_container.sh" model-accuracy

      - name: Run PR Nightly accuracy with private logging
        id: pr_accuracy
        if: inputs.pr_mode
        env:
          PPU_CI_SOURCE_DIR: ${{ steps.runtime.outputs.source }}
          PPU_CI_SOURCE_SHA: ${{ inputs.pr_head_sha }}
          PPU_CI_WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha }}
          PPU_CI_WHEELS_DIR: ${{ steps.runtime.outputs.wheels }}
          PPU_CI_ARTIFACT_DIR: ${{ steps.runtime.outputs.artifacts }}
          PPU_CI_HF_HOME: ${{ inputs.hf_home }}
          PPU_CI_DG_CACHE_DIR: ${{ inputs.dg_cache_dir }}
          GSM8K_DATASET_PATH: ${{ inputs.gsm8k_dataset_path }}
          CASE_ID: ${{ matrix.model.case_id }}
        run: |
          umask 077
          python3 -I - >"${PPU_CI_ARTIFACT_DIR}/launcher.log" 2>&1 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source = Path(os.environ["PPU_CI_SOURCE_DIR"])
          sha = os.environ["PPU_CI_WHEEL_SOURCE_SHA"]
          try:
              def read_source(path):
                  return subprocess.check_output(["git", "-C", str(source), "show", f"HEAD:{path}"])

              pin = read_source(".github/vllm-main-verified.commit").decode("ascii").strip()
              manifest = json.loads((Path(os.environ["PPU_CI_WHEELS_DIR"]) /
                                     "wheel-manifest.json").read_bytes())
              if (not re.fullmatch(r"[0-9a-f]{40}", pin) or manifest["schema"] != 1
                  or manifest["commits"]["vllm"] != pin
                  or manifest["commits"]["vllm-sail"] != sha):
                  raise ValueError("Wheel manifest does not match the required commits.")

              catalog = json.loads(read_source("scripts/ci/ppu_e2e_models.json"))
              case = next(entry for entry in catalog if entry["key"] == os.environ["CASE_ID"])
              child = {key: os.environ[key] for key in (
                  "PATH", "HOME", "GIT_CONFIG_GLOBAL", "GIT_CONFIG_NOSYSTEM",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "PPU_CI_RUNTIME_IMAGE",
                  "PPU_CI_SOURCE_DIR", "PPU_CI_SOURCE_SHA", "PPU_CI_WHEEL_SOURCE_SHA",
                  "PPU_CI_WHEELS_DIR", "PPU_CI_ARTIFACT_DIR", "PPU_CI_HF_HOME",
                  "PPU_CI_DG_CACHE_DIR", "GSM8K_DATASET_PATH", "CASE_ID",
              )}
              child.update(
                  PPU_CI_REQUIRE_PR_ARTIFACT="true",
                  PPU_CI_DEVICE_COUNT=str(int(case["ppu_count"])),
                  HF_HUB_OFFLINE="1",
                  MODEL_KEY=case["model_key"],
                  MODEL_ID=case["model_id"],
                  SERVER_CMD=json.dumps(case.get("server_cmd") or []),
                  SERVER_ENV=json.dumps(case.get("server_env") or {}),
              )
          except (ValueError, TypeError, KeyError, StopIteration, OSError,
                  subprocess.CalledProcessError):
              result = Path(os.environ["PPU_CI_ARTIFACT_DIR"]) / "legacy-accuracy-result.json"
              result.write_text('{"status":"runtime_setup_failed"}\n', encoding="utf-8")
              raise

          os.execvpe("bash", ["bash", str(source / "scripts/ci/ppu_runtime_container.sh"),
                              "model-accuracy"], child)
          PY

      - name: Generate public PR Nightly legacy summary
        id: pr_summary
        if: always() && inputs.pr_mode && steps.runtime.outcome == 'success'
        env:
          PRIVATE_DIR: ${{ steps.runtime.outputs.artifacts }}
          WHEELS_OUTCOME: ${{ steps.wheels.outcome }}
          ACCURACY_OUTCOME: ${{ steps.pr_accuracy.outcome }}
        run: |
          PUBLIC_DIR="$(mktemp -d "${RUNNER_TEMP}/ppu-accuracy-summary.XXXXXX")"
          printf '::add-mask::%s\n' "$PUBLIC_DIR"
          export PUBLIC_DIR
          python3 -I - <<'PY'
          import json
          import os
          import stat
          from pathlib import Path

          def read_result(path):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as source:
                  if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                      return {}
                  data = source.read(4097)
              result = json.loads(data) if len(data) <= 4096 else None
              return result if isinstance(result, dict) else {}

          accuracy_outcome = os.environ["ACCURACY_OUTCOME"]
          reason, gate, score, samples = "unknown", "not_available", None, None
          failures = {
              "fail_accuracy": "gsm8k_gate_failed",
              "fail_threshold": "gsm8k_gate_failed",
              "fail_completeness": "completeness_failed",
              "fail_identity": "golden_identity_mismatch",
              "fail_config": "golden_config_mismatch",
          }
          phase_failures = {"runtime_setup_failed", "server_startup_failed", "gsm8k_eval_failed"}
          if os.environ["WHEELS_OUTCOME"] == "failure":
              case_status = "fail"
              reason = "runtime_setup_failed"
          else:
              case_status = {
                  "success": "pass",
                  "failure": "fail",
                  "cancelled": "cancelled",
              }.get(accuracy_outcome, "not_run")
              if accuracy_outcome in {"success", "failure"}:
                  path = Path(os.environ["PRIVATE_DIR"]) / "legacy-accuracy-result.json"
                  try:
                      record = read_result(path)
                  except (OSError, ValueError, RecursionError):
                      record = {}
                  status = record.get("status")
                  if isinstance(status, str):
                      if accuracy_outcome == "success" and status in {"pass", "created", "updated"}:
                          reason, gate = "not_applicable", "pass"
                      elif accuracy_outcome == "failure" and status in failures:
                          reason, gate = failures[status], "fail"
                      elif accuracy_outcome == "failure" and status in phase_failures:
                          reason = status
                  if gate != "not_available":
                      raw_score, raw_samples = record.get("score"), record.get("num")
                      if type(raw_score) in (int, float) and 0 <= raw_score <= 1:
                          score = raw_score
                      if type(raw_samples) is int and 0 <= raw_samples <= 100_000:
                          samples = raw_samples

          summary = {"status": case_status, "failure_reason": reason, "gsm8k": {
              "score": score, "evaluated_samples": samples, "gate": gate,
          }}
          output = Path(os.environ["PUBLIC_DIR"]) / "summary.json"
          with output.open("x", encoding="utf-8") as target:
              json.dump(summary, target, allow_nan=False)
          PY
          printf 'summary=%s/summary.json\n' "$PUBLIC_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload PR Nightly legacy summary
        if: always() && inputs.pr_mode && steps.pr_summary.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pr-nightly-legacy-${{ matrix.model.case_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.pr_summary.outputs.summary }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload accuracy diagnostics
        if: always() && !inputs.pr_mode
        uses: actions/upload-artifact@v4
        with:
          name: ppu-accuracy-${{ matrix.model.case_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.runtime.outputs.artifacts }}/**
            ${{ steps.runtime.outputs.wheels }}/wheel-manifest.json
          if-no-files-found: warn
          retention-days: 14
